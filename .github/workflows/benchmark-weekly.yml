name: Weekly Benchmark Automation

on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allow manual trigger for testing

# The routine run commits README.md directly to main; it does not open a pull
# request, so only contents: write is required.
permissions:
  contents: write

jobs:
  run-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # 3 hours timeout for comprehensive benchmarks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker
        uses: docker/setup-buildx-action@v4

      - name: Install Apache Bench
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2-utils

      - name: Make benchmark scripts executable
        run: |
          chmod +x benchmark-all.sh
          chmod +x benchmark-stress-all.sh
          [ -f format_results.sh ] && chmod +x format_results.sh || true
          [ -f benchmark-stress.sh ] && chmod +x benchmark-stress.sh || true

      - name: Run comprehensive benchmarks
        run: |
          echo "Starting benchmark suite..."
          # Run the benchmark-all script which benchmarks all languages
          ./benchmark-all.sh
          echo "Benchmark suite completed."
        continue-on-error: true

      - name: Generate benchmark timestamp
        id: timestamp
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "datetime=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Ensure benchmark results file exists
        run: |
          touch benchmark_results.txt

      - name: Create benchmark results summary
        run: |
          echo "# Benchmark Results - ${{ steps.timestamp.outputs.datetime }}" > benchmark_summary.md
          echo "" >> benchmark_summary.md
          echo "## Overview" >> benchmark_summary.md
          echo "" >> benchmark_summary.md
          echo "Automated weekly benchmark run completed on ${{ steps.timestamp.outputs.datetime }}." >> benchmark_summary.md
          echo "" >> benchmark_summary.md

          if [ -s benchmark_results.txt ]; then
            echo "## Results Summary" >> benchmark_summary.md
            echo "" >> benchmark_summary.md
            echo "| Rank | Language | Req/sec | Time/req (ms) | Status |" >> benchmark_summary.md
            echo "|------|----------|---------|---------------|--------|" >> benchmark_summary.md

            # Parse and format results, sorted by req/sec descending
            RANK=1
            while IFS='|' read -r lang rps tpr tr fr; do
              if [ "$rps" = "BUILD_FAILED" ] || [ "$rps" = "SERVER_FAILED" ]; then
                echo "| - | $lang | N/A | N/A | ❌ $rps |" >> benchmark_summary.md
              elif [ -n "$rps" ] && [ -n "$tpr" ]; then
                echo "| $RANK | $lang | $rps | $tpr | ✅ Success |" >> benchmark_summary.md
                RANK=$((RANK + 1))
              fi
            done < <(sort -t'|' -k2 -nr benchmark_results.txt)
          fi

          echo "" >> benchmark_summary.md
          echo "---" >> benchmark_summary.md
          echo "*Generated automatically by GitHub Actions on ${{ steps.timestamp.outputs.datetime }}*" >> benchmark_summary.md

      - name: Update README with new benchmark results
        run: |
          python3 << 'PYEOF'
          import re, sys

          # Language display names
          LANG_DISPLAY = {
              'c': 'C', 'cpp': 'C++', 'csharp': 'C#', 'go': 'Go', 'rust': 'Rust',
              'javascript': 'JavaScript', 'typescript': 'TypeScript', 'java': 'Java',
              'kotlin': 'Kotlin', 'python': 'Python', 'ruby': 'Ruby', 'php': 'PHP',
              'nim': 'Nim', 'v': 'V', 'zig': 'Zig', 'crystal': 'Crystal',
              'fortran': 'Fortran', 'ada': 'Ada', 'assembly': 'Assembly',
          }

          # Framework/Library mapping
          FRAMEWORKS = {
              'c': 'libmicrohttpd', 'crystal': 'HTTP::Server', 'rust': 'Actix-web',
              'go': 'net/http', 'zig': 'Raw sockets (Thread.Pool)', 'cpp': 'Crow',
              'php': 'Raw sockets (pcntl + sockets)', 'v': 'net', 'kotlin': 'Ktor',
              'java': 'Spring Boot', 'python': 'FastAPI + Uvicorn',
              'javascript': 'Express', 'ruby': 'Sinatra + Puma',
              'typescript': 'Express', 'nim': 'std asynchttpserver',
              'fortran': 'Raw sockets (iso_c_binding)', 'csharp': 'ASP.NET Core',
              'ada': 'Raw sockets (C interop)', 'assembly': 'Raw syscalls (poll)',
          }

          # Parse benchmark results
          results = []
          try:
              with open('benchmark_results.txt') as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      parts = line.split('|')
                      if len(parts) >= 3:
                          lang = parts[0].strip()
                          rps = parts[1].strip()
                          tpr = parts[2].strip()
                          if rps not in ('BUILD_FAILED', 'SERVER_FAILED', ''):
                              try:
                                  results.append((lang, float(rps), float(tpr)))
                              except ValueError:
                                  pass
          except FileNotFoundError:
              print("benchmark_results.txt not found, skipping README update")
              sys.exit(0)

          if not results:
              print("No successful benchmark results found, skipping README update")
              sys.exit(0)

          # Sort by req/sec descending
          results.sort(key=lambda x: x[1], reverse=True)

          # Generate new table rows
          header = '| Rank | Language | Framework/Library | Requests/sec | Avg Latency (ms) |'
          sep    = '|------|----------|-------------------|--------------|------------------|'
          rows = [header, sep]
          for rank, (lang, rps, tpr) in enumerate(results, 1):
              lang_name = LANG_DISPLAY.get(lang, lang.capitalize())
              framework = FRAMEWORKS.get(lang, 'Unknown')
              rows.append(f'| {rank} | **{lang_name}** | {framework} | {rps:,.2f} | {tpr:.2f} |')
          new_table = '\n'.join(rows)

          # Read README
          with open('README.md') as f:
              content = f.read()

          # Replace the existing benchmark table
          # Match from the header row through all subsequent table rows
          pattern = (
              r'(\| Rank \| Language \| Framework/Library \| Requests/sec \| Avg Latency \(ms\) \|'
              r'[^\n]*\n\|[-| ]+\|\n(?:\|[^\n]+\|\n)*)'
          )
          match = re.search(pattern, content)
          if match:
              new_content = content[:match.start()] + new_table + '\n' + content[match.end():]
              with open('README.md', 'w') as f:
                  f.write(new_content)
              print(f"Updated README.md benchmark table with {len(results)} languages")
          else:
              print("Warning: Could not find benchmark table in README.md, skipping update")
          PYEOF
        continue-on-error: true

      - name: Commit updated README only
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only README.md is committed to main. Benchmark artifacts are left on
          # the runner and uploaded as workflow artifacts so no other repository
          # files are touched by the routine run.
          git add README.md
          if git diff --cached --quiet; then
            echo "No benchmark changes to commit"
          else
            git commit -m "chore: update README with weekly benchmark results - ${{ steps.timestamp.outputs.datetime }}"
            git push origin main
            echo "README committed directly to main"
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ steps.timestamp.outputs.date }}
          path: |
            benchmark_results.txt
            benchmark_summary.md
            README.md
          if-no-files-found: warn
          retention-days: 90

      - name: Workflow summary
        if: always()
        run: |
          echo "## Benchmark Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: ${{ steps.timestamp.outputs.datetime }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Completed" >> $GITHUB_STEP_SUMMARY

          if [ -s benchmark_results.txt ]; then
            echo "- **Results**: Generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Quick Stats" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            success_count=$(grep -v "BUILD_FAILED\|SERVER_FAILED" benchmark_results.txt | grep -c '|' || echo "0")
            failed_count=$(grep -cE "BUILD_FAILED|SERVER_FAILED" benchmark_results.txt || echo "0")

            echo "- ✅ Successful benchmarks: $success_count" >> $GITHUB_STEP_SUMMARY
            echo "- ❌ Failed benchmarks: $failed_count" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Results (sorted by req/sec)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Language | Req/sec | Latency (ms) |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|---------|--------------|" >> $GITHUB_STEP_SUMMARY
            sort -t'|' -k2 -nr benchmark_results.txt | while IFS='|' read -r lang rps tpr tr fr; do
              if [ "$rps" != "BUILD_FAILED" ] && [ "$rps" != "SERVER_FAILED" ] && [ -n "$rps" ]; then
                echo "| $lang | $rps | $tpr |" >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "- **Results**: No results generated" >> $GITHUB_STEP_SUMMARY
          fi
