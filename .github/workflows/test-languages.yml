name: Test Language Implementations

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Compiled languages that can be built directly
  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Rust server
        working-directory: ./rust
        run: cargo build --release

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.21'
      - name: Build Go server
        working-directory: ./go
        run: go build -o server main.go

  test-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libmicrohttpd-dev
      - name: Build C server
        working-directory: ./c
        run: gcc -o server server.c -lmicrohttpd -O3

  test-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget cmake libboost-all-dev
      - name: Download Crow header
        working-directory: ./cpp
        run: wget https://github.com/CrowCpp/Crow/releases/download/v1.0%2B5/crow_all.h
      - name: Build C++ server
        working-directory: ./cpp
        run: g++ -o server server.cpp -lpthread -O3 -std=c++14

  test-crystal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - name: Build Crystal server
        working-directory: ./crystal
        run: crystal build --release server.cr

  test-zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig
        run: |
          wget https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          tar -xf zig-linux-x86_64-0.13.0.tar.xz
          rm zig-linux-x86_64-0.13.0.tar.xz
          echo "$PWD/zig-linux-x86_64-0.13.0" >> $GITHUB_PATH
      - name: Build Zig server
        working-directory: ./zig
        # Use -lc to link against libc for c_allocator
        run: zig build-exe server.zig -O ReleaseFast -lc

  test-nim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.0.0'
      - name: Build Nim server
        working-directory: ./nim
        run: nim c -d:release --opt:speed server.nim

  test-v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup V
        uses: vlang/setup-v@v1
        with:
          check-latest: true
      - name: Build V server
        working-directory: ./v
        run: v -prod server.v

  test-fortran:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Build Fortran server
        working-directory: ./fortran
        run: gfortran -o server server.f90 -O3

  # JVM languages
  test-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build Java server
        working-directory: ./java
        run: mvn clean package

  test-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.5'
      - name: Build Kotlin server
        working-directory: ./kotlin
        run: gradle build --no-daemon

  # .NET languages
  test-csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build C# server
        working-directory: ./csharp
        run: dotnet build csharp-server.csproj

  # Interpreted languages with syntax checking
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ./python
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install pylint
      - name: Check Python syntax
        working-directory: ./python
        run: python -m py_compile main.py
      - name: Lint Python code
        working-directory: ./python
        run: pylint --errors-only main.py || true

  test-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: ./javascript
        run: npm install
      - name: Check JavaScript syntax
        working-directory: ./javascript
        run: node --check server.js

  test-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: ./typescript
        run: npm install
      - name: Compile TypeScript
        working-directory: ./typescript
        run: npm run build

  test-ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Install dependencies
        working-directory: ./ruby
        run: bundle install
      - name: Check Ruby syntax
        working-directory: ./ruby
        run: ruby -c server.rb

  test-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install dependencies
        working-directory: ./php
        run: composer install
      - name: Check PHP syntax
        working-directory: ./php
        run: php -l server.php

  # Assembly - just check file exists and has content
  test-assembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm
      - name: Check Assembly file
        working-directory: ./assembly
        run: |
          if [ -f server.asm ]; then
            echo "Assembly file exists"
            nasm -f elf64 server.asm -o server.o || echo "Assembly compilation may require additional setup"
          else
            echo "Assembly file not found"
            exit 1
          fi
